name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run check:workflows
      - run: npm run check:design
      - run: npm run check:plugin
      - run: npm run check:clean

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node cli/bin/dent.js skill
      - run: node cli/bin/dent.js skill references/interview.md
      - run: node cli/bin/dent.js install --target "$env:RUNNER_TEMP\harness" --provider claude-code --yes
      - run: node cli/bin/dent.js check --target "$env:RUNNER_TEMP\harness" --provider claude-code
      - run: node cli/bin/dent.js check --target "$env:RUNNER_TEMP\harness" --provider claude-code --quiet
      - run: npm install -g .
      - run: dent --version
